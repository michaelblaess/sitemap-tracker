[build-system]
requires = ["setuptools>=77.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sitemap-tracker"
version = "2.13.1"
description = "Sitemap Tracker - crawls websites, generates sitemap.xml, tracks dead links and SEO issues in a TUI"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.12"
authors = [
    { name = "Michael Blaess" },
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Developers",
    "Topic :: Internet :: WWW/HTTP :: Site Management",
]
dependencies = [
    "textual>=0.85.0",
    "playwright>=1.40.0",
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "textual-image[textual]>=0.12.0",
    "textual-fspicker>=0.4.0",
    "Pillow>=10.0",
    "textual-themes[textual]>=0.15.1",
    "textual-widgets>=0.32.1",
    "textual-slider>=0.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.5",
    "mypy>=1.8",
    "poethepoet>=0.29",
    "ruff>=0.3",
]

[tool.setuptools.package-data]
sitemap_tracker = ["locale/*.json", "*.tcss"]

[project.urls]
Homepage = "https://github.com/michaelblaess/sitemap-tracker"
Repository = "https://github.com/michaelblaess/sitemap-tracker"
Issues = "https://github.com/michaelblaess/sitemap-tracker/issues"

[project.scripts]
sitemap-tracker = "sitemap_tracker.__main__:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[[tool.mypy.overrides]]
# textual-widgets/-image liefern keinen py.typed-Marker - ohne diesen
# Override meldet mypy "missing library stubs or py.typed marker".
module = ["textual_widgets.*", "textual_image.*"]
ignore_missing_imports = true

[tool.poe.tasks]
run = { cmd = "python -m sitemap_tracker", help = "Startet sitemap-tracker" }
test = { cmd = "pytest", help = "Tests sequentiell (schnell bei Unit-Tests)" }
test-parallel = { cmd = "pytest -n auto", help = "Tests parallel (fuer langsame Test-Suiten)" }
cov = { cmd = "pytest --cov=sitemap_tracker --cov-report=term-missing", help = "Tests + Coverage" }
typecheck = { cmd = "mypy src", help = "mypy strict ueber src/" }
lint = { cmd = "ruff check .", help = "Ruff Linting" }
fmt = { cmd = "ruff format .", help = "Ruff Formatting" }
fix = { cmd = "ruff check --fix .", help = "Ruff Auto-Fix" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
ignore = ["E501", "ASYNC109", "ASYNC240", "E402", "N806"]
